name: 在线打包安卓 APK

# 什么时候跑：
#   1) 在 GitHub 网页上手动点「Run workflow」（推荐，最省事）
#   2) 改动 buildozer.spec 或本文件并推送时自动跑
on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU 架构：arm64-v8a = 2017 年后的手机基本都行；选 both 会慢一倍"
        required: true
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - both
  push:
    branches: [master, main]
    paths:
      - buildozer.spec
      - .github/workflows/android-apk.yml

# 同一分支只跑最新一次，避免占着队列白等
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# 失败时要把日志尾巴贴成 commit 评论，需要写内容的权限；
# 其余权限按最小原则给（cache / upload-artifact 用的是运行时令牌，不受这里影响）。
permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    name: 打包 APK
    runs-on: ubuntu-latest
    # 首次要下载 Android SDK / NDK 并编译 CPython，给足时间
    timeout-minutes: 150

    env:
      # 手动触发用下拉框的值；push 触发时没有输入，回落到默认值
      TARGET_ARCH: ${{ github.event.inputs.arch || 'arm64-v8a' }}

    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      # ✅ 安全闸门：个人数据绝不能进 APK。
      # 这些文件都被 .gitignore 排除，正常 checkout 不会出现；
      # 万一哪天被误提交，这里直接让构建失败，而不是打出带凭据的包。
      - name: 检查有没有误提交个人数据
        run: |
          bad=0
          for f in cookies.json config.json gui_settings.json execution.json ai_courses.json; do
            if [ -e "$f" ]; then
              echo "::error::$f 出现在仓库里，绝不能打进 APK（它可能含账号会话或密码）"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] && echo "✅ 未发现 cookies.json / config.json 等个人数据文件"
          exit "$bad"

      # 缓存 Android SDK / NDK（约 2~3 GB）。命中后能省 20~30 分钟。
      # 注意：这一步必须放在「改架构」之前，否则 key 会随架构变化而失效。
      - name: 缓存 Android SDK / NDK
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-global-${{ runner.os }}-

      - name: 选择要打的架构
        if: env.TARGET_ARCH != 'both'
        run: |
          sed -i "s|^android.archs = .*|android.archs = ${TARGET_ARCH}|" buildozer.spec
          echo "本次架构：" && grep -n "^android.archs" buildozer.spec

      # ------------------------------------------------------------------
      # 为什么不用 ArtemSBulgakov/buildozer-action：
      #   它的 Dockerfile 是 `FROM ghcr.io/kivy/buildozer:latest`，然后在上面
      #   补装 JDK —— 但补装用的是已经失效的 PPA（ppa:openjdk-r/ppa），
      #   新基础镜像（ubuntu 26.04 / resolute）里没有对应 Release 文件，
      #   `apt update` 直接 100 退出，镜像根本构不出来。
      #   而官方镜像本身已经自带 openjdk-17-jdk，那一步纯属多余。
      #   所以这里直接调官方镜像，绕过那个年久失修的 action。
      # ------------------------------------------------------------------
      - name: 用官方 Kivy 镜像打包（首次约 40~70 分钟）
        run: |
          set -euo pipefail

          # 预先建好，保证宿主机侧属主是 runner，方便后面 actions/cache 读写
          mkdir -p .buildozer_global

          # 说明：
          #  * 镜像自带的 entrypoint.sh 会读 hostcwd 的 uid/gid、建同名用户并 chown，
          #    再以该用户执行 buildozer —— 所以不需要 --user root。
          #  * 它同时把 HOME 固定成 /home/user，因此 buildozer 的「全局目录」
          #    就是 /home/user/.buildozer，我们把它挂到工作区的 .buildozer_global，
          #    于是 SDK/NDK 才能被 actions/cache 缓存住。
          #  * ⚠ 参数只写 buildozer 自己的子命令（android debug）。
          #    镜像 entrypoint 已经在前面接好 buildozer 可执行文件了，
          #    再多写一个 "buildozer" 会变成 `buildozer buildozer android debug`，
          #    报 "Unknown command/target buildozer"。
          docker run --rm \
            -e APP_ANDROID_ACCEPT_SDK_LICENSE=1 \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            -v "$GITHUB_WORKSPACE/.buildozer_global":/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest \
            android debug 2>&1 | tee build.log

      # 构建失败时，把日志最后 250 行贴成一条 commit 评论。
      # 为什么这么做：公开仓库的 Actions 日志接口**匿名也是 403**，
      # 一旦手上没有有效令牌就完全看不到失败原因；而 commit 评论对公开仓库
      # 是可以匿名读的（GET /repos/{owner}/{repo}/commits/{sha}/comments）。
      # 这样失败原因永远留痕、随时能查，不依赖任何人手里的令牌。
      - name: 失败时公开日志尾巴（无需令牌即可查阅）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build.log ]; then
            echo "没有 build.log（可能在更早的步骤就失败了）"
            exit 0
          fi
          tail -n 250 build.log > build_tail.txt
          echo "----- 日志最后 250 行 -----"
          cat build_tail.txt
          echo "---------------------------"
          {
            echo "本次打包失败，下面是日志最后 250 行（自动生成，方便无令牌时查因）"
            echo '```'
            cat build_tail.txt
            echo '```'
          } > comment.md
          jq -Rs '{body: .}' comment.md > payload.json
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            --input payload.json \
            || echo "贴评论失败，不影响本次结论"

      - name: 列出产物
        run: ls -la bin/

      # 不复用 action 的 filename 输出：它是取 bin/ 里「第一个」文件，
      # 打两个架构时会漏掉一个。这里直接收全部。
      - name: 上传 APK（在本次运行的页面下方即可下载）
        uses: actions/upload-artifact@v4
        with:
          name: fuckZHS-APK-${{ env.TARGET_ARCH }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
